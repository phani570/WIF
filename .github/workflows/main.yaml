name: List services in GCP
on:
  pull_request:
    branches:
      - main
      - feature/*

  workflow_dispatch:

permissions:
  id-token: write

jobs:
  Get_OIDC_ID_token:
    runs-on: ubuntu-latest
    steps:
    - id: 'auth'
      name: 'Authenticate to GCP'
      uses: 'google-github-actions/auth@v2.0.1'
      with:
          create_credentials_file: 'true'
          project_id: 'user-mmqwxblaebws'
          workload_identity_provider: 'https://iam.googleapis.com/projects/21919101738/locations/global/workloadIdentityPools/github/providers/github'

    - id: 'gcloud'
      name: 'gcloud'
      run: |-
        gcloud auth login --brief --cred-file="${{ steps.auth.outputs.credentials_file_path }}"
        gcloud services list
